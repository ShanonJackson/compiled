[package]
name = "compiled_swc_plugin"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "SWC plugin replacement for the Compiled Babel plugins"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
once_cell = "1.19"
rustc-hash = "1.1"
serde = { version = "1.0.197", features = ["derive"] }
serde_derive = "1.0.197"
serde_json = "1.0.104"
oxc_resolver = "11.9.0"
thiserror = "1.0"
swc_atoms = "26.4.5"
swc_common = "26.4.5"
swc_ecma_ast = "26.4.5"
swc_ecma_codegen = "26.4.5"
swc_ecma_parser = "26.4.5"
swc_ecma_utils = "26.4.5"
swc_ecma_visit = "26.4.5"
swc_plugin = "26.4.5"
swc_plugin_macro = "26.4.5"
