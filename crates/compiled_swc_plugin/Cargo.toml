[package]
name = "compiled_swc_plugin"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "SWC plugin replacement for the Compiled Babel plugins"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
once_cell = "1.19"
rustc-hash = "1.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
oxc_resolver = "11.9.0"
thiserror = "1.0"
swc_core = { version = "0.91.24", features = [
    "ecma_plugin_transform",
    "ecma_ast",
    "ecma_parser",
    "ecma_visit",
    "common",
] }
