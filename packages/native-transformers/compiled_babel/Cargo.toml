[package]
name = "compiled_babel"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
oxc_resolver = "11.13.1"
oxc_browserslist = { package = "oxc-browserslist", version = "2.1.2" }
serde = { version = "=1.0.197", features = ["derive"] }
serde_json = "=1.0.128"
indexmap = "=2.6.0"
csscolorparser = "0.6"
once_cell = "1.19.0"
regex = "1.10.4"
swc_atoms = "5.0.0"
swc_core = { version = "=26.3.4", features = [
  "common",
  "css_ast",
  "css_codegen",
  "css_parser",
  "css_visit",
  "ecma_ast",
  "ecma_plugin_transform",
  "ecma_utils",
  "ecma_visit"
] }

[dev-dependencies]
insta = "1.39.0"
