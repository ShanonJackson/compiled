[package]
name = "compiled_strip_runtime"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
oxc_resolver = "11.13.1"
serde = { version = "=1.0.197", features = ["derive"] }
serde_json = "=1.0.128"
swc_core = { version = "=26.3.4", features = [
  "ecma_plugin_transform",
  "ecma_visit",
  "ecma_ast",
  "ecma_utils",
  "common"
] }

[dev-dependencies]
insta = "1.39.0"
