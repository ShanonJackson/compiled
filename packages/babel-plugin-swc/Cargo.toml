[package]
name = "compiled_babel_plugin_swc"
version = "0.1.0"
edition = "2021"
authors = ["Compiled CSS-in-JS"]
description = "SWC-based port of the Compiled Babel plugin"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
anyhow = "1.0"
once_cell = "1.19"
oxc_resolver = "11.13.1"
serde = { version = "=1.0.203", features = ["derive"] }
serde_json = "=1.0.120"
smallvec = "1.13"
swc_core = { version = "=26.3.4", features = ["common", "ecma_ast", "ecma_codegen", "ecma_parser", "ecma_utils", "ecma_visit"] }
thiserror = "1.0"
tracing = "0.1"
indexmap = "2.2"

[dev-dependencies]
tempfile = "3.13"

[features]
default = ["extract"]
extract = []
